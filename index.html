<style>
:root{
  --ink:#0E2130;
  --teal:#14555A;
  --mint:#7FD8C4;
  --amber:#E3A64B;
  --mist:#E9F1EF;
  --paper:#F5F9F8;
  --on-light:#0E2130;
  --on-light-mute:#4A6470;
  --on-dark:#EEF5F3;
  --on-dark-2:#C9DBD7;
  --on-dark-mute:#9DB8B3;
  --rule-light:rgba(14,33,48,.14);
  --rule-dark:rgba(230,241,238,.16);
  --serif:'Fraunces','Noto Serif TC','Noto Serif CJK TC',serif;
  --sans:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --wrap:1180px;
  --gutter:clamp(20px,5vw,64px);
}
html[lang="en"]{
  --sans:'Noto Sans','Noto Sans TC','Noto Sans CJK TC',sans-serif;
}
html[lang="ja"]{
  --serif:'Fraunces','Noto Serif JP','Noto Serif CJK JP',serif;
  --sans:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif;
}
html[lang="ja"] :is(.hero-lead,.hero-sub,.h2,.lede,.verb,.src p,.step p,.mode p,.use p){word-break:auto-phrase}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.85;color:var(--on-light);background:var(--paper);-webkit-font-smoothing:antialiased}
html[lang="en"] body{line-height:1.7}
img,svg,canvas{display:block}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:-999px;top:8px;background:var(--amber);color:var(--ink);padding:8px 14px;z-index:100}
.skip:focus{left:8px}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s}
.nav.solid{background:rgba(14,33,48,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:74px;color:var(--on-dark)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.brand-logo{height:48px;width:auto}
.brand-sub{font-size:13px;color:var(--on-dark-mute);letter-spacing:.06em}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:15px}
.nav ul a{text-decoration:none;color:var(--on-dark-2);transition:color .2s}
.nav ul a:hover{color:#fff}
.lang{display:flex;gap:2px;font-size:13px;border:1px solid var(--rule-dark);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--on-dark-mute);padding:3px 10px;border-radius:999px;cursor:pointer;line-height:1.5}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{background:var(--on-dark);color:var(--ink)}
.btn{display:inline-block;font-weight:500;text-decoration:none;border-radius:999px;transition:background .2s,color .2s}
.btn-amber{background:var(--amber);color:var(--ink);padding:9px 22px;font-size:15px;white-space:nowrap}
.btn-amber:hover{background:#F0B967}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;background:radial-gradient(120% 90% at 72% 38%,#173B4B 0%,var(--ink) 58%);color:var(--on-dark);overflow:hidden;display:flex;align-items:flex-end}
#breath{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:relative;padding-bottom:clamp(56px,10vh,110px);width:100%}
.wordmark{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(4.2rem,13.5vw,11.5rem);line-height:.92;letter-spacing:-.025em;margin:0 0 .28em;font-variation-settings:"opsz" 144}
.hero-lead{font-family:var(--serif);font-size:clamp(1.6rem,3.2vw,2.5rem);font-weight:500;line-height:1.4;margin:0 0 .6em}
html[lang="en"] .hero-lead{font-weight:400}
.hero-sub{max-width:31em;color:var(--on-dark-2);margin:0}
.cue{position:absolute;left:0;top:0;text-shadow:0 0 8px #0E2130,0 0 2px #0E2130;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--on-dark-2);font-size:14px;letter-spacing:.14em;transform:translate(-50%,-30px);pointer-events:none;visibility:hidden}
.cue.ready{visibility:visible}
.cue svg{width:60px;height:60px}
.cue circle{fill:none;stroke-width:1.4}
.cue .track{stroke:rgba(230,241,238,.18)}
.cue .prog{stroke:var(--mint);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

/* ---------- shared ---------- */
section{position:relative}
.sec{padding:clamp(88px,13vw,168px) 0}
.sec-head{max-width:42em;margin-bottom:clamp(48px,7vw,88px)}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.2vw,3.3rem);line-height:1.25;margin:0 0 .5em;letter-spacing:.005em}
html[lang="en"] .h2{font-weight:400;letter-spacing:-.01em}
.lede{font-size:clamp(1.02rem,1.4vw,1.15rem);color:var(--on-light-mute);margin:0;max-width:36em}
.dark{background:var(--ink);color:var(--on-dark)}
.dark .lede{color:var(--on-dark-2)}
.mist{background:var(--mist)}

/* ---------- meaning ---------- */
.uses{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-light)}
.use{display:grid;grid-template-columns:minmax(180px,5fr) 7fr;gap:clamp(20px,5vw,72px);padding:clamp(36px,5vw,56px) 0;border-bottom:1px solid var(--rule-light);align-items:start}
.verb{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,7.4vw,6.2rem);line-height:1;margin:0;color:var(--teal);letter-spacing:.03em}
html[lang="en"] .verb{letter-spacing:-.02em;font-weight:300}
.verb small{display:block;font-family:'Fraunces',serif;font-size:max(14px,.2em);letter-spacing:.04em;color:var(--on-light-mute);margin-top:.9em;font-weight:300;font-style:italic}
.verb small:empty{display:none}
.use p{margin:0;max-width:32em}
.use p + p{margin-top:.8em;color:var(--on-light-mute);font-size:15.5px}
.fields{margin:22px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px}
.fields dt{font-size:13.5px;color:var(--on-light-mute);margin-right:4px}
.fields dd{margin:0;font-size:14px;line-height:1.5;padding:5px 13px;border:1px solid rgba(20,85,90,.28);border-radius:999px;color:var(--teal);background:rgba(255,255,255,.55)}

/* ---------- sources: space-time map ---------- */
.map-box{position:relative;margin-bottom:clamp(40px,6vw,64px)}
#stmap{width:100%;height:440px}
#stmap text{font-family:var(--sans)}
.srcs{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;border-top:1px solid var(--rule-light);padding-top:30px}
.src h3{font-family:var(--serif);font-weight:500;font-size:1.4rem;margin:0 0 .4em;line-height:1.3;display:flex;align-items:center;gap:10px}
.src h3::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--dot);background:color-mix(in srgb,var(--dot) 25%,transparent);flex:none}
.src p{margin:0;font-size:15.5px;color:var(--on-light-mute);line-height:1.8}
html[lang="en"] .src p{font-size:15px;line-height:1.65}

/* ---------- data ---------- */
.data{background:linear-gradient(180deg,var(--teal) 0%,#103F46 100%);color:var(--on-dark)}
.data .lede{color:#CFE3DE}
.stats{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1px solid rgba(230,241,238,.24)}
.stat{padding:36px 28px 32px 0}
.stat + .stat{padding-left:28px;border-left:1px solid rgba(230,241,238,.24)}
.num{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(3.2rem,6.4vw,5.6rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;display:block;margin-bottom:.32em}
.stat:first-child .num{color:var(--amber)}
.stat-label{font-size:1.05rem;font-weight:500;display:block}
.stat-note{font-size:14.5px;color:#BCD6D0;display:block;margin-top:.3em}
.data-meta{margin-top:28px;font-size:14px;color:#BCD6D0;min-height:1.6em}
.topics{margin-top:80px}
.topics h3{font-family:var(--serif);font-weight:500;font-size:1.45rem;margin:0 0 .3em}
.topics-cap{font-size:14.5px;color:#BCD6D0;margin:0 0 26px;max-width:40em}
.topics-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center}
#bubbles{width:100%;height:400px}
.legend-list{list-style:none;margin:0;padding:0;columns:1}
.legend-list li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(230,241,238,.12);font-size:15px}
.legend-list li:last-child{border-bottom:0}
.legend-list i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.legend-list b{font-weight:400;font-variant-numeric:tabular-nums;color:#CFE3DE}

/* ---------- tech ---------- */
#tech{color:var(--on-dark)}
.flow{display:grid;grid-template-columns:.9fr .9fr 2fr 2fr;gap:0;border-top:1px solid var(--rule-dark)}
.step{padding:30px 22px 8px 0}
.step + .step{padding-left:22px;border-left:1px solid var(--rule-dark)}
.step-n{font-family:'Fraunces',serif;font-weight:400;font-size:1.1rem;color:var(--mint);display:block;margin-bottom:12px}
.step h3{font-family:var(--serif);font-weight:500;font-size:1.55rem;margin:0 0 .5em;color:#fff}
.step p{margin:0;font-size:16px;color:var(--on-dark-2);line-height:1.75}
html[lang="en"] .step p{font-size:15.5px;line-height:1.6}
.viz{margin:22px 0 18px;height:118px;display:flex;align-items:flex-end}
.viz svg{width:100%;height:100%}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.mode h4{font-size:1.05rem;font-weight:500;margin:14px 0 .3em;color:#fff}
.mode p{font-size:15px}
html[lang="en"] .mode p{font-size:14.5px}
.mode figure{margin:0;border-radius:10px;overflow:hidden;background:#0A1924;border:1px solid var(--rule-dark);position:relative;height:160px}
.mode canvas,.mode svg{width:100%;height:100%}
.mode figcaption{position:absolute;right:10px;top:6px;font-size:11.5px;color:var(--on-dark-mute);letter-spacing:.04em}
.tech-note{margin-top:40px;font-size:14.5px;color:var(--on-dark-2)}

/* ---------- research ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.tab{font-size:15px;border:1px solid var(--rule-light);background:transparent;color:var(--on-light-mute);padding:8px 18px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.tab:hover{color:var(--on-light);border-color:rgba(14,33,48,.35)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.papers{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-light)}
.paper{padding:24px 0;border-bottom:1px solid var(--rule-light);display:grid;grid-template-columns:5.5em 1fr;gap:24px}
.paper-year{font-family:'Fraunces',serif;font-weight:300;font-size:1.6rem;color:var(--teal);line-height:1.2}
.paper h3{font-size:1.08rem;font-weight:500;line-height:1.55;margin:0 0 .3em}
.paper h3 a{text-decoration:none;background-image:linear-gradient(var(--teal),var(--teal));background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .3s}
.paper h3 a:hover{background-size:100% 1px}
.paper-journal{font-size:14px;color:var(--on-light-mute);font-style:italic;margin:0}
.empty{padding:34px 0;color:var(--on-light-mute)}

/* ---------- partners ---------- */
.partners{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(28px,5vw,64px);border-top:1px solid var(--rule-light);padding-top:36px}
.pgroup h3{font-size:14.5px;font-weight:500;color:var(--on-light-mute);margin:0 0 18px;letter-spacing:.06em}
.pgroup ul{list-style:none;margin:0;padding:0}
.pgroup li{font-family:var(--serif);font-size:1.3rem;line-height:1.45;padding:11px 0;border-bottom:1px solid var(--rule-light)}
html[lang="en"] .pgroup li{font-size:1.18rem}
.pgroup li:last-child{border-bottom:0}
.pgroup li.with-logo{display:flex;align-items:center;gap:14px}
.pgroup li.with-logo img{width:48px;height:48px;object-fit:contain;flex:none}
.award strong{display:block;font-size:1.4rem;font-weight:500;line-height:1.35}
.award span{display:block;color:var(--on-light-mute);font-family:var(--sans);font-size:15px;margin-top:.3em}

/* ---------- cta ---------- */
.cta{background:radial-gradient(90% 120% at 15% 100%,#1B4651 0%,var(--ink) 60%);color:var(--on-dark);overflow:hidden}
.cta .h2{font-size:clamp(2.4rem,5.6vw,4.6rem);margin-bottom:.4em}
.cta .lede{color:var(--on-dark-2)}
.cta-row{margin-top:40px}
.btn-lg{padding:15px 34px;font-size:17px}
.cta-orb{position:absolute;right:-6vw;top:50%;width:min(46vw,520px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,rgba(127,216,196,.28) 0%,rgba(127,216,196,.06) 45%,transparent 70%);pointer-events:none;animation:orb 10s ease-in-out infinite}
@keyframes orb{0%,100%{transform:translateY(-50%) scale(.86)}40%{transform:translateY(-50%) scale(1.06)}}

/* ---------- footer ---------- */
footer{background:#0A1924;color:var(--on-dark-mute);font-size:14px;padding:44px 0}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
.foot-brand{display:flex;align-items:center;gap:18px;line-height:1.7}
.foot-brand img{height:56px;width:auto}
footer a{color:var(--on-dark)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .nav ul{display:none}
}
@media (max-width:960px){
  .flow{grid-template-columns:1fr 1fr}
  .step:nth-child(3),.step:nth-child(4){grid-column:1 / -1;border-left:0;padding-left:0;border-top:1px solid var(--rule-dark)}
  .srcs{grid-template-columns:1fr 1fr 1fr}
  .partners{grid-template-columns:1fr 1fr}
  .award-col{grid-column:1 / -1}
  .topics-grid{grid-template-columns:1fr}
  .legend-list{columns:2;column-gap:28px}
  .legend-list li{break-inside:avoid}
}
@media (max-width:720px){
  body{font-size:16px}
  .nav .wrap{gap:12px}
  .brand-sub{display:none}
  .brand-logo{height:42px}
  .btn-amber{padding:8px 14px;font-size:14px}
  .lang button{padding:3px 7px}
  .use{grid-template-columns:1fr;gap:14px}
  #stmap{height:400px}
  .srcs{grid-template-columns:1fr;gap:22px}
  .stats{grid-template-columns:1fr}
  .stat,.stat + .stat{padding:28px 0;border-left:0;border-bottom:1px solid rgba(230,241,238,.24)}
  #bubbles{height:320px}
  .legend-list{columns:1}
  .flow{grid-template-columns:1fr}
  .step,.step + .step{padding:28px 0 8px;border-left:0;border-top:1px solid var(--rule-dark)}
  .step:first-child{border-top:0}
  .paper{grid-template-columns:1fr;gap:4px}
  .partners{grid-template-columns:1fr}
}
@media (max-width:420px){
  .modes{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .cta-orb{animation:none}
}
</style>
</head>

/* ====================== hero：呼吸粒子 ====================== */
const Hero = (function(){
  const hero = document.getElementById('hero');
  const cv = document.getElementById('breath');
  const ctx = cv.getContext('2d');
  const cue = document.getElementById('cue');
  const cueText = document.getElementById('cueText');
  const cueRing = document.getElementById('cueRing');
  const wm = document.getElementById('wordmark');
  const RING = 169.6, INHALE = 4.2, EXHALE = 6.3, CYCLE = INHALE + EXHALE;
  let W, H, cx, cy, R, parts = [], running = true, t0 = performance.now(), lastLabel = '';
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

  function resize(){
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const narrow = W < 720;
    const wmTop = wm.getBoundingClientRect().top - hero.getBoundingClientRect().top;
    cx = narrow ? W * .5 : W * .75;
    cy = Math.max(narrow ? 150 : 170, Math.min(H * (narrow ? .33 : .38), wmTop - (narrow ? 70 : 90)));
    R = Math.min(W, H) * (narrow ? .42 : .4);
    cue.style.left = cx + 'px'; cue.style.top = cy + 'px'; cue.classList.add('ready');
    const n = Math.round(Math.min(1500, Math.max(500, W * H / 850)));
    parts = [];
    for (let i = 0; i < n; i++){
      const r = Math.pow(Math.random(), .55);
      parts.push({ a: Math.random() * 6.283, r, sp: (Math.random() - .5) * .00045 * (1.4 - r), z: Math.random(), s: .5 + Math.random() * 1.5, ph: Math.random() * 6.283, amber: Math.random() < (r > .75 ? .2 : .06) });
    }
  }
  function phase(sec){
    const p = sec % CYCLE;
    if (p < INHALE) return { b: ease(p / INHALE), inhale: true, prog: p / INHALE };
    const q = (p - INHALE) / EXHALE;
    return { b: 1 - ease(q), inhale: false, prog: q };
  }
  function draw(sec){
    const { b, inhale, prog } = phase(sec);
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, R * (0.55 + 0.45 * b)));
    g.addColorStop(0, `rgba(127,216,196,${0.10 + 0.08 * b})`);
    g.addColorStop(1, 'rgba(127,216,196,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const scale = 0.62 + 0.42 * b;
    for (const p of parts){
      p.a += p.sp;
      const wob = 1 + 0.06 * Math.sin(sec * 0.7 + p.ph);
      const rr = p.r * R * scale * wob * (0.9 + 0.2 * p.z);
      const x = cx + Math.cos(p.a) * rr, y = cy + Math.sin(p.a) * rr * 0.82;
      const alpha = (0.28 + 0.6 * p.z) * (0.55 + 0.45 * b) * (1 - p.r * 0.35);
      ctx.fillStyle = p.amber ? `rgba(227,166,75,${alpha})` : `rgba(127,216,196,${alpha})`;
      ctx.beginPath(); ctx.arc(x, y, p.s * (0.75 + 0.4 * b), 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    const label = inhale ? T().inhale : T().exhale;
    if (label !== lastLabel){ cueText.textContent = label; lastLabel = label; }
    cueRing.setAttribute('stroke-dashoffset', (RING * (1 - prog)).toFixed(1));
  }
  function loop(now){ if (running) draw(Math.max(0, (now - t0) / 1000)); requestAnimationFrame(loop); }
  function start(){
    resize();
    addEventListener('resize', () => { resize(); if (reduceMotion) draw(INHALE * 0.9); });
    if (reduceMotion){ cue.style.display = 'none'; draw(INHALE * 0.9); }
    else { new IntersectionObserver(es => { running = es[0].isIntersecting; }).observe(cv); requestAnimationFrame(loop); }
  }
  return { start, relayout: () => { resize(); lastLabel = ''; if (reduceMotion) draw(INHALE * 0.9); } };
})();

function countUp(el, target){
  if (reduceMotion){ el.textContent = fmt(target); return; }

}

function packCircles(items, W, H, gap){
  const placed = [];
  for (const it of items){
    if (!placed.length){ it.x = 0; it.y = 0; placed.push(it); continue; }
    let done = false;
    for (let d = 1; d < 4000 && !done; d += 1.5){
      const steps = Math.max(24, Math.round(d / 2));
      for (let k = 0; k < steps; k++){
        const a = k / steps * 6.283 + d * 0.013;
        const x = Math.cos(a) * d * (W / H > 1.3 ? 1.35 : 1), y = Math.sin(a) * d;
        if (placed.every(p => Math.hypot(p.x - x, p.y - y) >= p.r + it.r + gap)){ it.x = x; it.y = y; done = true; break; }
      }
    }
    placed.push(it);
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of placed){ x0 = Math.min(x0, p.x - p.r); x1 = Math.max(x1, p.x + p.r); y0 = Math.min(y0, p.y - p.r); y1 = Math.max(y1, p.y + p.r); }
  const s = Math.min((W - 8) / (x1 - x0), (H - 8) / (y1 - y0), 1.6);
  for (const p of placed){ p.x = (p.x - (x0 + x1) / 2) * s + W / 2; p.y = (p.y - (y0 + y1) / 2) * s + H / 2; p.r *= s; }
  return placed;
}

(function techStatic(){
  let d = '';
  for (let x = 0; x <= 200; x += 2){
    const y = 92 - 58 * Math.exp(-Math.pow((x - 70) / 14, 2)) - 30 * Math.exp(-Math.pow((x - 128) / 9, 2)) - 18 * Math.exp(-Math.pow((x - 166) / 7, 2)) - 2 * Math.sin(x * .9);
    d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
  }
  document.getElementById('sig').setAttribute('d', d);
  let t = '';
  for (let x = 0; x <= 360; x += 4){
    const rise = 1 / (1 + Math.exp(-(x - 120) / 18)), fall = 1 / (1 + Math.exp((x - 270) / 22));
    const y = 136 - 86 * rise * (0.55 + 0.45 * fall) - 3 * Math.sin(x * .21);
    t += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
  }
  document.getElementById('trace').setAttribute('d', t);
  document.getElementById('traceFill').setAttribute('d', t + 'L360 160 L0 160 Z');
  // 氣味圖騰（GC-IMS 式二維圖樣）
  const c = document.getElementById('fp'), x = c.getContext('2d'), w = c.width, h = c.height, r = rng(7);
  const spots = [];
  for (let i = 0; i < 34; i++) spots.push({ x: 40 + r() * (w - 60), y: 14 + r() * (h - 30), sx: 3 + r() * 7, sy: 2 + r() * 5, a: 0.25 + r() * 0.85 });
  spots.push({ x: 30, y: 0, sx: 4, sy: 400, a: 0.55 });
  const img = x.createImageData(w, h), stops = [[10,25,36],[20,85,90],[127,216,196],[227,166,75],[255,236,200]];
  const cmap = v => { v = Math.max(0, Math.min(.999, v)) * (stops.length - 1); const i = Math.floor(v), f = v - i, a = stops[i], b = stops[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; };
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
    let v = 0;
    for (const s of spots){ const dx = (px - s.x) / s.sx, dy = (py - s.y) / s.sy, e = dx * dx + dy * dy; if (e < 12) v += s.a * Math.exp(-e / 2); }
    const [R, G, B] = cmap(Math.min(1, v * 0.9)), k = (py * w + px) * 4;
    img.data[k] = R; img.data[k + 1] = G; img.data[k + 2] = B; img.data[k + 3] = 255;

  let line = '';
  vals.forEach((v, i) => {
    const hh = v * 118, x0 = 8 + i * bw + bw * 0.2, y0 = 144 - hh;
    svgEl('rect', { x: x0, y: y0, width: bw * 0.6, height: hh, rx: 1.5, fill: '#7FD8C4', opacity: (0.25 + 0.06 * i).toFixed(2) }, tr);
    line += (i ? 'L' : 'M') + (x0 + bw * 0.3).toFixed(1) + ' ' + (y0 - 9).toFixed(1);
  });
  svgEl('path', { d: line, fill: 'none', stroke: '#E3A64B', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, tr);
  svgEl('line', { x1: 8, y1: 144.5, x2: 182, y2: 144.5, stroke: 'rgba(230,241,238,.18)' }, tr);
})();

function renderRadar(){
  const t = T(), svg = document.getElementById('radar');
  svg.innerHTML = ''; svg.setAttribute('aria-label', t.radarAria);
  const W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const axes = t.radarAxes, now = [0.72, 0.60, 0.68, 0.52, 0.93, 0.46], base = [0.66, 0.64, 0.62, 0.56, 0.60, 0.50];
  const FS = 11.5, cx = W / 2, cy = H / 2 + 4;
  // 量測標籤寬度，決定標籤放外側或內側
  const probe = svgEl('text', { 'font-size': FS, 'font-family': getComputedStyle(document.body).fontFamily }, svg);
  const widths = axes.map(a => { probe.textContent = a; return probe.getComputedTextLength(); });
  probe.remove();
  const sideMax = Math.max(widths[1], widths[2], widths[4], widths[5]);
  let R = Math.min(H / 2 - 22, (W / 2 - sideMax - 10) / 0.866), noLabels = false;
  if (R < 36){ noLabels = true; R = Math.min(W / 2, H / 2) - 18; }
  svg.closest('.mode').classList.toggle('radar-nolabel', noLabels);
  const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  [0.25, 0.5, 0.75, 1].forEach(v => svgEl('polygon', { points: axes.map((_, i) => pt(i, v).join(',')).join(' '), fill: 'none', stroke: 'rgba(230,241,238,.11)' }, svg));
  axes.forEach((_, i) => { const [ex, ey] = pt(i, 1); svgEl('line', { x1: cx, y1: cy, x2: ex, y2: ey, stroke: 'rgba(230,241,238,.11)' }, svg); });
  svgEl('polygon', { points: base.map((v, i) => pt(i, v).join(',')).join(' '), fill: 'none', stroke: '#E3A64B', 'stroke-width': 1.4, 'stroke-dasharray': '4 3' }, svg);
  const g = svgEl('g', { style: `transform-origin:${cx}px ${cy}px;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),opacity .6s;${radarShown ? '' : 'transform:scale(.2);opacity:0'}` }, svg);
  svgEl('polygon', { points: now.map((v, i) => pt(i, v).join(',')).join(' '), fill: 'rgba(127,216,196,.22)', stroke: '#7FD8C4', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, g);
  now.forEach((v, i) => { const [px, py] = pt(i, v); svgEl('circle', { cx: px, cy: py, r: 2.6, fill: '#7FD8C4' }, g); });
  if (!noLabels) axes.forEach((name, i) => {
    let [lx, ly] = pt(i, 1);
    const top = i === 0, bottom = i === 3, right = i === 1 || i === 2;
    const anchor = top || bottom ? 'middle' : (right ? 'start' : 'end');
    lx += top || bottom ? 0 : (right ? 7 : -7); ly += top ? -8 : bottom ? 16 : 4;
    svgEl('text', { x: lx, y: ly, 'text-anchor': anchor, 'font-size': FS, fill: '#E3EEEB' }, svg).textContent = name;
  });
  if (!radarShown){
    new IntersectionObserver((es, o) => { if (es[0].isIntersecting){ radarShown = true; g.style.transform = 'scale(1)'; g.style.opacity = 1; o.disconnect(); } }, { threshold: .5 }).observe(svg);
  }
}

  const t = T(), panel = document.getElementById('paperPanel');
  const list = SD.lit && SD.lit.latest ? SD.lit.latest[currentTheme] : null;
  if (!list){ panel.innerHTML = `<p class="empty">${esc(t.resNone)}</p>`; return; }
  if (!list.length){ panel.innerHTML = `<p class="empty">${esc(t.resEmpty)}</p>`; return; }
  panel.innerHTML = '<ul class="papers">' + list.map(r => {
    const title = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title);
    return `<li class="paper"><div class="paper-year">${esc(r.year || '')}</div><div><h3>${title}</h3>${r.journal ? `<p class="paper-journal">${esc(r.journal)}</p>` : ''}</div></li>`;
  }).join('') + '</ul>';
}
(function bindTabs(){
  const tabs = document.getElementById('tabs');
  tabs.addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    currentTheme = b.dataset.k;
    tabs.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    renderPapers();
  });
  tabs.addEventListener('keydown', e => {
    if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
    const all = [...tabs.querySelectorAll('.tab')], i = all.indexOf(document.activeElement); if (i < 0) return;
    const n = all[(i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length]; n.focus(); n.click();
  });
})();

/* ====================== 語言切換 ====================== */
function applyLang(lang){
  LANG = LANGS.includes(lang) ? lang : 'en';
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  document.querySelector('meta[name="description"]').setAttribute('content', t.desc);
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.getElementById('vizGas').textContent = t.vizGas;
  document.getElementById('vizLiquid').textContent = t.vizLiquid;
  document.getElementById('ctaBtn').href = `mailto:${EMAIL}?subject=${encodeURIComponent(t.mailSubject)}`;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  try { localStorage.setItem('konos-lang', LANG); } catch(e) {}
  renderUses(); renderStats(); renderTabs(); renderPapers();
  // 字型載入後再量測與排版圖表
  const layout = () => { renderSources(); renderTopics(); renderRadar(); Hero.relayout(); };
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
}
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b) applyLang(b.dataset.lang); });

function initialLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('konos-lang'); if (LANGS.includes(s)) return s; } catch(e) {}
  return 'en';
}

/* ====================== 啟動 ====================== */
document.getElementById('yr').textContent = new Date().getFullYear();
Hero.start();
applyLang(initialLang());
if (reduceMotion) startStats();
else new IntersectionObserver((es, o) => { if (es[0].isIntersecting){ startStats(); o.disconnect(); } }, { threshold: .4 }).observe(document.getElementById('stats'));
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderSources(); renderTopics(); renderRadar(); }, 150); });
</script>
